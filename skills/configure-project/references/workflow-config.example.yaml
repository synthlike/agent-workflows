# Incomplete template: configure-project must replace both REQUIRED values.
schema_version: 2

distribution:
  source: REQUIRED_DISTRIBUTION_SOURCE
  version: REQUIRED_EXACT_VERSION_OR_COMMIT_SHA

installation:
  selected:
    - REQUIRED_SELECTED_SKILL
  skills:
    configure-project: REQUIRED_CONFIGURE_PROJECT_PATH
    REQUIRED_SELECTED_SKILL: REQUIRED_SELECTED_SKILL_PATH

issue_tracker:
  backend: local-markdown
  root: .project

artifacts:
  domain:
    enabled: true
    path: docs/domain
  arps:
    enabled: true
    path: docs/decisions
    prefix: ARP
  rfcs:
    enabled: true
    path: docs/rfcs
    prefix: RFC
  meetings:
    enabled: false
    path: docs/meetings
  specifications:
    enabled: true
    path: docs/specifications
