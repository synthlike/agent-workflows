schema_version: 1

distribution:
  source: github.com/OWNER/agent-workflows
  version: unreleased

issue_tracker:
  backend: local-markdown
  root: .project

artifacts:
  domain:
    enabled: true
    path: docs/domain
  arps:
    enabled: true
    path: docs/decisions
    prefix: ARP
  rfcs:
    enabled: true
    path: docs/rfcs
    prefix: RFC
  meetings:
    enabled: false
    path: docs/meetings
  specifications:
    enabled: true
    path: docs/specifications
