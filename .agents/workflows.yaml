schema_version: 2

distribution:
  source: github.com/synthlike/agent-workflows
  version: v0.3.0

installation:
  selected:
    - author-specification
    - capture-meeting
    - clarify-intent
    - develop-rfc
    - establish-technical-baseline
    - investigate-failure
    - model-domain
    - plan-implementation
    - plan-initiative
    - prepare-handoff
    - prepare-questionnaire
    - prototype-design
    - record-arp
    - research-question
  skills:
    author-specification: skills/author-specification
    capture-meeting: skills/capture-meeting
    clarify-intent: skills/clarify-intent
    configure-project: skills/configure-project
    develop-rfc: skills/develop-rfc
    establish-technical-baseline: skills/establish-technical-baseline
    investigate-failure: skills/investigate-failure
    model-domain: skills/model-domain
    plan-implementation: skills/plan-implementation
    plan-initiative: skills/plan-initiative
    prepare-handoff: skills/prepare-handoff
    prepare-questionnaire: skills/prepare-questionnaire
    prototype-design: skills/prototype-design
    record-arp: skills/record-arp
    research-question: skills/research-question

issue_tracker:
  backend: local-markdown
  root: .project

artifacts:
  domain:
    enabled: true
    path: docs/domain
  arps:
    enabled: true
    path: docs/decisions
    prefix: ARP
  rfcs:
    enabled: true
    path: docs/rfcs
    prefix: RFC
  meetings:
    enabled: false
    path: docs/meetings
  specifications:
    enabled: true
    path: docs/specifications
