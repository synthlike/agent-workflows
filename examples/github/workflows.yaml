# Incomplete example: configure-workflows must replace every REQUIRED value.
schema_version: 2
distribution:
  source: REQUIRED_DISTRIBUTION_SOURCE
  version: REQUIRED_EXACT_VERSION_OR_COMMIT_SHA
installation:
  selected: [REQUIRED_SELECTED_SKILL]
  skills:
    configure-workflows: REQUIRED_CONFIGURE_WORKFLOWS_PATH
    REQUIRED_SELECTED_SKILL: REQUIRED_SELECTED_SKILL_PATH
issue_tracker:
  backend: github
  login: REQUIRED_GITHUB_LOGIN
artifacts:
  domain: {enabled: true, path: docs/domain}
  arps: {enabled: true, path: docs/decisions, prefix: ARP}
  rfcs: {enabled: true, path: docs/rfcs, prefix: RFC}
  meetings: {enabled: true, path: docs/meetings}
  research: {enabled: true, path: docs/research}
  questionnaires: {enabled: true, path: docs/questionnaires}
  technical_baselines: {enabled: true, path: docs/engineering}
  prototypes: {enabled: false, path: docs/prototypes}
  handoffs: {enabled: false, path: .agents/handoffs}
  specifications: {enabled: true, path: docs/specifications}
